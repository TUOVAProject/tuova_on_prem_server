events {
}

http {

  # airflow HTTP + TLS
  server {

    listen 30003 ssl;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    error_page 497 301 =307 https://$http_host$request_uri;

    location / {
      proxy_pass http://tuova-etl-airflow-apiserver:8080;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
    }
  }

  # influxdb HTTP + TLS
  server {

    listen 30004 ssl;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    error_page 497 301 =307 https://$http_host$request_uri;

    location / {
      proxy_pass http://tuova-etl-influxdb:8086;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
    }
  }

}

# postgres TCP
stream {
    upstream postgres {
        server tuova-etl-postgres:5432;
    }

    server {
        listen 30001;
        proxy_pass postgres;
    }
}
