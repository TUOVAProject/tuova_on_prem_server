# airflow-specific
x-airflow-common: &airflow-common
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.0.4}
    environment: &airflow-common-env
        AIRFLOW__CORE__TEST_CONNECTION: "Enabled"
        AIRFLOW__CORE__EXECUTOR: CeleryExecutor
        AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASS}@tuova-etl-airflow-postgres/airflow
        AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASS}@tuova-etl-airflow-postgres/airflow
        AIRFLOW__CELERY__BROKER_URL: redis://:@tuova-etl-airflow-redis:6379/0
        AIRFLOW__CORE__FERNET_KEY: ""
        AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://tuova-etl-airflow-apiserver:8080/execution/"
        AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
        _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
        AIRFLOW_CONFIG: "/opt/airflow/config/airflow.cfg"
        AIRFLOW__API__BASE_URL: https://${HOSTNAME}:${AIRFLOW_PORT}
    volumes:
        - ./data/airflow-data/dags:/opt/airflow/dags
        - ./data/airflow-data/logs:/opt/airflow/logs
        - ./data/airflow-data/config:/opt/airflow/config
        - ./data/airflow-data/plugins:/opt/airflow/plugins
    user: root
    depends_on: &airflow-common-depends-on
        tuova-etl-airflow-redis:
            condition: service_healthy
        tuova-etl-airflow-postgres:
            condition: service_healthy

# all services
services:
    # nginx proxy (airflow, postgresql, influxdb)
    tuova-etl-nginx:
        image: nginx:latest
        container_name: tuova-etl-nginx
        restart: unless-stopped
        ports:
            - ${AIRFLOW_PORT}:${AIRFLOW_PORT}
            - ${POSTGRES_PORT}:${POSTGRES_PORT}
            - ${INFLUXDB_PORT}:${INFLUXDB_PORT}
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
            - ./certs/cert.pem:/etc/nginx/certs/cert.pem:ro
            - ./certs/key.pem:/etc/nginx/certs/key.pem:ro
        depends_on:
            - tuova-etl-airflow-apiserver
            - tuova-etl-postgres
            - tuova-etl-influxdb

    # data warehouse
    tuova-etl-postgres:
        image: postgres:18-bookworm
        container_name: tuova-etl-postgres
        restart: unless-stopped
        env_file: ./.env
        volumes:
            - ./data/postgres-data:/var/lib/postgresql
            - ./certs:/certs:ro
        command: >
            postgres -c ssl=on
                     -c ssl_cert_file=/certs/cert.pem
                     -c ssl_key_file=/certs/key.pem

    # machine data storage
    tuova-etl-influxdb:
        image: influxdb:2.7
        container_name: tuova-etl-influxdb
        restart: unless-stopped
        volumes:
            - ./data/influxdb/data:/var/lib/influxdb2
            - ./data/influxdb/config:/etc/influxdb2

    # airflow containers

    # config etc.
    tuova-etl-airflow-postgres:
        image: postgres:13
        container_name: tuova-etl-airflow-postgres
        environment:
            POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
            POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASS}
            POSTGRES_DB: airflow
        volumes:
            - ./data/airflow-data/postgres-db-volume:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "airflow"]
            interval: 10s
            retries: 5
            start_period: 5s
        restart: unless-stopped

    # caching
    tuova-etl-airflow-redis:
        image: redis:7.2-bookworm
        container_name: tuova-etl-airflow-redis
        expose:
            - 6379
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 30s
            retries: 50
            start_period: 30s
        restart: unless-stopped

    # API
    tuova-etl-airflow-apiserver:
        <<: *airflow-common
        container_name: tuova-etl-airflow-apiserver
        command: api-server
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "--fail",
                    "http://localhost:8080/api/v2/version",
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: unless-stopped
        depends_on:
            <<: *airflow-common-depends-on
            tuova-etl-airflow-init:
                condition: service_completed_successfully

    # scheduling
    tuova-etl-airflow-scheduler:
        <<: *airflow-common
        container_name: tuova-etl-airflow-scheduler
        command: scheduler
        healthcheck:
            test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: unless-stopped
        depends_on:
            <<: *airflow-common-depends-on
            tuova-etl-airflow-init:
                condition: service_completed_successfully

    # DAGs
    tuova-etl-airflow-dag-processor:
        <<: *airflow-common
        container_name: tuova-etl-airflow-dag-processor
        command: dag-processor
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"',
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: unless-stopped
        depends_on:
            <<: *airflow-common-depends-on
            tuova-etl-airflow-init:
                condition: service_completed_successfully

    # workers
    tuova-etl-airflow-worker:
        <<: *airflow-common
        container_name: tuova-etl-airflow-worker
        command: celery worker
        healthcheck:
            test:
                - "CMD-SHELL"
                - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        environment:
            <<: *airflow-common-env
            DUMB_INIT_SETSID: "0"
        restart: unless-stopped
        depends_on:
            <<: *airflow-common-depends-on
            tuova-etl-airflow-apiserver:
                condition: service_healthy
            tuova-etl-airflow-init:
                condition: service_completed_successfully

    # something about event-driven tasks
    tuova-etl-airflow-triggerer:
        <<: *airflow-common
        container_name: tuova-etl-airflow-triggerer
        command: triggerer
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"',
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: unless-stopped
        depends_on:
            <<: *airflow-common-depends-on
            tuova-etl-airflow-init:
                condition: service_completed_successfully

    # startup
    tuova-etl-airflow-init:
        <<: *airflow-common
        container_name: tuova-etl-airflow-init
        entrypoint: /bin/bash
        command:
            - -c
            - |
                if [[ -z "${AIRFLOW_UID}" ]]; then
                  echo
                  echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
                  echo "If you are on Linux, you SHOULD follow the instructions below to set "
                  echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
                  echo "For other operating systems you can get rid of the warning with manually created .env file:"
                  echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
                  echo
                  export AIRFLOW_UID=$$(id -u)
                fi
                one_meg=1048576
                mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
                cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
                disk_available=$$(df / | tail -1 | awk '{print $$4}')
                warning_resources="false"
                if (( mem_available < 4000 )) ; then
                  echo
                  echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
                  echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
                  echo
                  warning_resources="true"
                fi
                if (( cpus_available < 2 )); then
                  echo
                  echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
                  echo "At least 2 CPUs recommended. You have $${cpus_available}"
                  echo
                  warning_resources="true"
                fi
                if (( disk_available < one_meg * 10 )); then
                  echo
                  echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
                  echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
                  echo
                  warning_resources="true"
                fi
                if [[ $${warning_resources} == "true" ]]; then
                  echo
                  echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
                  echo "Please follow the instructions to increase amount of resources available:"
                  echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
                  echo
                fi
                echo
                echo "Creating missing opt dirs if missing:"
                echo
                mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
                echo
                echo "Airflow version:"
                /entrypoint airflow version
                echo
                echo "Files in shared volumes:"
                echo
                ls -la /opt/airflow/{logs,dags,plugins,config}
                echo
                echo "Running airflow config list to create default config file if missing."
                echo
                /entrypoint airflow config list >/dev/null
                echo
                echo "Files in shared volumes:"
                echo
                ls -la /opt/airflow/{logs,dags,plugins,config}
                echo
                echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
                echo
                chown -R "${AIRFLOW_UID}:0" /opt/airflow/
                echo
                echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
                echo
                chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
                echo
                echo "Files in shared volumes:"
                echo
                ls -la /opt/airflow/{logs,dags,plugins,config}

        environment:
            <<: *airflow-common-env
            _AIRFLOW_DB_MIGRATE: "true"
            _AIRFLOW_WWW_USER_CREATE: "true"
            _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
            _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
            _PIP_ADDITIONAL_REQUIREMENTS: ""
        user: "0:0"

    # cli (?)
    tuova-etl-airflow-cli:
        <<: *airflow-common
        container_name: tuova-etl-airflow-cli
        profiles:
            - debug
        environment:
            <<: *airflow-common-env
            CONNECTION_CHECK_MAX_COUNT: "0"
        command:
            - bash
            - -c
            - airflow
        depends_on:
            <<: *airflow-common-depends-on

    # celery cluster management (?)
    tuova-etl-airflow-flower:
        <<: *airflow-common
        container_name: tuova-etl-airflow-flower
        command: celery flower
        profiles:
            - flower
        healthcheck:
            test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: unless-stopped
        depends_on:
            <<: *airflow-common-depends-on
            tuova-etl-airflow-init:
                condition: service_completed_successfully
